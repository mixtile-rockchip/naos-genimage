# NAOS Core configuration. Edit this file, then restart naos-core.
[platform]
soc=rk3588

[http]
enabled=true
listen=127.0.0.1:8890

[core]
socket=/run/naos/core.sock
state_dir=/var/lib/naos-core

[container]
enabled=false
address=/var/run/naosd.sock
manifest=/userdata/manifest.yml

[boot]
check_enabled=false
check_program=

[hawkbit]
enabled=false
server_url=
tenant=
controller_id=
token=
token_type=target
poll_interval=4m
timeout=30s
download_path=/var/lib/naos-core/downloads

[watchdog]
enabled=true
device=/dev/watchdog0
timeout=30s
feed_interval=10s
